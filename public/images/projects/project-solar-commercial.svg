<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyCom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <pattern id="solarGridCom" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect width="26" height="18" fill="#032B43" stroke="#38BDF8" stroke-width="0.8" rx="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#skyCom)" />
  
  <!-- Sun Glow -->
  <circle cx="700" cy="80" r="50" fill="#FDE047" opacity="0.9" filter="drop-shadow(0 0 25px #F59E0B)" />

  <!-- Commercial Flat Roof Structure with Multiple Arrays -->
  <!-- Array 1 -->
  <polygon points="50,220 380,220 330,140 100,140" fill="url(#solarGridCom)" stroke="#38BDF8" stroke-width="2" />
  <!-- Array 2 -->
  <polygon points="420,220 750,220 700,140 470,140" fill="url(#solarGridCom)" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Array 3 (Foreground) -->
  <polygon points="30,380 770,380 720,260 80,260" fill="url(#solarGridCom)" stroke="#38BDF8" stroke-width="2.5" />

  <!-- High-Power 10kVA Inverter Hub -->
  <g transform="translate(620, 310)">
    <rect width="130" height="140" rx="6" fill="#0F172A" stroke="#E31E24" stroke-width="3" />
    <text x="65" y="30" fill="#38BDF8" font-family="'Poppins', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COMMERCIAL HUB</text>
    <text x="65" y="55" fill="#10B981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">10.2 kWp</text>
    <rect x="20" y="75" width="90" height="8" rx="2" fill="#334155" />
    <rect x="20" y="75" width="82" height="8" rx="2" fill="#10B981" />
    <text x="65" y="110" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">GRID-TIE / HYBRID</text>
  </g>

  <!-- Tag / Watermark -->
  <rect x="30" y="30" width="230" height="36" rx="6" fill="#E31E24" opacity="0.9" />
  <text x="145" y="53" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAMPLE PROJECT PHOTO</text>

  <text x="760" y="470" fill="#F8FAFC" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" text-anchor="end">10kVA Commercial Solar System</text>
</svg>

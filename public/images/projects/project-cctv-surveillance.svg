<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCctv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="irGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E31E24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgCctv)" />

  <!-- Security Grid Overlay -->
  <g stroke="#1F5FA8" stroke-width="0.8" opacity="0.2">
    <circle cx="400" cy="250" r="120" fill="none" />
    <circle cx="400" cy="250" r="220" fill="none" />
    <line x1="400" y1="20" x2="400" y2="480" />
    <line x1="100" y1="250" x2="700" y2="250" />
  </g>

  <!-- High-Tech Dome / Bullet Wireless Camera Montage -->
  <!-- Left Side: Wall Mount Wireless Bullet Camera -->
  <g transform="translate(180, 140)">
    <!-- Wall bracket -->
    <rect x="-30" y="40" width="30" height="80" rx="4" fill="#334155" />
    <rect x="0" y="70" width="60" height="18" rx="2" fill="#475569" />
    <!-- Camera body -->
    <polygon points="60,50 170,60 170,100 60,110" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <!-- Sun shield -->
    <path d="M 50 45 L 180 55 L 180 60 L 50 50 Z" fill="#E31E24" />
    <!-- Lens & IR Ring -->
    <ellipse cx="170" cy="80" rx="8" ry="20" fill="#0F172A" stroke="#1F5FA8" stroke-width="2" />
    <circle cx="170" cy="80" r="6" fill="#38BDF8" />
    <circle cx="160" cy="70" r="2.5" fill="#E31E24" />
    <!-- Dual Wi-Fi Antennas -->
    <line x1="100" y1="52" x2="80" y2="5" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="120" y1="53" x2="135" y2="5" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    
    <!-- Wi-Fi Wave Signals -->
    <path d="M 80 -10 A 15 15 0 0 1 135 -10" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 70 -20 A 25 25 0 0 1 145 -20" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.5" />
  </g>

  <!-- Right Side: Monitoring HUD Viewfinder -->
  <g transform="translate(440, 120)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="300" height="210" rx="10" fill="#0F172A" stroke="#1F5FA8" stroke-width="3" />
    <!-- HUD Screen Corner Brackets -->
    <path d="M 20 40 H 40 V 20" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    <path d="M 280 40 H 260 V 20" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    <path d="M 20 170 H 40 V 190" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    <path d="M 280 170 H 260 V 190" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    
    <!-- Motion Detect Target Box -->
    <rect x="90" y="65" width="120" height="80" stroke="#E31E24" stroke-width="1.5" stroke-dasharray="4" fill="none" />
    <text x="92" y="60" fill="#E31E24" font-family="monospace" font-size="10" font-weight="bold">● LIVE REC: 1080P HD</text>
    <text x="92" y="160" fill="#10B981" font-family="monospace" font-size="10">AI MOTION DETECTED</text>
    
    <text x="150" y="195" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">WIRELESS IP CAMERA 04</text>
  </g>

  <!-- Tag / Watermark -->
  <rect x="30" y="30" width="230" height="36" rx="6" fill="#1F5FA8" opacity="0.95" />
  <text x="145" y="53" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAMPLE PROJECT PHOTO</text>

  <text x="760" y="470" fill="#F8FAFC" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" text-anchor="end">Wireless CCTV Surveillance</text>
</svg>

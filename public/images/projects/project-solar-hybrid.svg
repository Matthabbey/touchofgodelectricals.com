<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#1F5FA8" />
    </linearGradient>
    <linearGradient id="solarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F5FA8" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="solarGrid" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="38" height="28" fill="#0C4A6E" rx="2" />
      <line x1="0" y1="14" x2="38" y2="14" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
      <line x1="19" y1="0" x2="19" y2="28" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgSolar)" />
  
  <!-- Circuit & Grid Lines in Background -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.15">
    <path d="M 0 100 H 800 M 0 250 H 800 M 0 400 H 800" />
    <path d="M 150 0 V 500 M 400 0 V 500 M 650 0 V 500" />
  </g>

  <!-- Rooftop Solar PV Representation -->
  <g transform="translate(180, 80)">
    <polygon points="40,200 400,200 340,60 100,60" fill="url(#solarGrid)" stroke="#38BDF8" stroke-width="2" />
    <polygon points="40,200 400,200 400,215 40,215" fill="#334155" />
    
    <!-- Sun Ray Angle -->
    <circle cx="340" cy="40" r="30" fill="#F59E0B" opacity="0.8" />
    <circle cx="340" cy="40" r="50" fill="#F59E0B" opacity="0.2" />
  </g>

  <!-- Lithium Inverter Unit Representation -->
  <g transform="translate(100, 270)">
    <!-- Main Inverter Cabinet -->
    <rect x="0" y="0" width="160" height="180" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="3" />
    <rect x="20" y="20" width="120" height="50" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="80" y="45" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">5.0 kVA PURE SINE</text>
    <text x="80" y="60" fill="#10B981" font-family="monospace" font-size="11" text-anchor="middle">STATUS: 100% ONLINE</text>
    
    <!-- Battery Level Indicator Bars -->
    <rect x="30" y="90" width="100" height="12" rx="3" fill="#334155" />
    <rect x="30" y="90" width="85" height="12" rx="3" fill="#10B981" />
    
    <!-- Red Brand Accent line -->
    <line x1="20" y1="125" x2="140" y2="125" stroke="#E31E24" stroke-width="3" />
    <circle cx="80" cy="150" r="10" fill="#E31E24" />
  </g>

  <!-- Lithium Battery Bank -->
  <g transform="translate(300, 290)">
    <rect x="0" y="0" width="180" height="160" rx="6" fill="#1E293B" stroke="#1F5FA8" stroke-width="2.5" />
    <text x="90" y="30" fill="#F8FAFC" font-family="'Poppins', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">LITHIUM LiFePO4</text>
    <text x="90" y="48" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">48V 100Ah (4.8kWh)</text>
    
    <rect x="25" y="70" width="130" height="25" rx="4" fill="#0F172A" />
    <circle cx="45" cy="82" r="5" fill="#10B981" />
    <circle cx="65" cy="82" r="5" fill="#10B981" />
    <circle cx="85" cy="82" r="5" fill="#10B981" />
    <text x="125" y="86" fill="#10B981" font-family="monospace" font-size="11">ACTIVE</text>
    
    <!-- Heavy Duty Cable Connectors -->
    <path d="M 0 50 C -40 50, -20 120, -40 120" stroke="#E31E24" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 0 80 C -50 80, -30 140, -40 140" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Tag / Watermark -->
  <rect x="30" y="30" width="230" height="36" rx="6" fill="#E31E24" opacity="0.9" />
  <text x="145" y="53" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAMPLE PROJECT PHOTO</text>
  
  <text x="760" y="470" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" text-anchor="end">Solar &amp; Inverter Installation</text>
</svg>

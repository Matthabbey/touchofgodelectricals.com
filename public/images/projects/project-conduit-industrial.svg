<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConduit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="metalPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgConduit)" />

  <!-- Industrial Wall Texture Grid -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.3">
    <path d="M 0 50 H 800 M 0 150 H 800 M 0 250 H 800 M 0 350 H 800 M 0 450 H 800" />
    <path d="M 100 0 V 500 M 300 0 V 500 M 500 0 V 500 M 700 0 V 500" />
  </g>

  <!-- Industrial Cable Trays & EMT Conduits -->
  <!-- Overhead Cable Tray -->
  <rect x="0" y="80" width="800" height="30" fill="#475569" stroke="#64748B" stroke-width="2" />
  <g stroke="#94A3B8" stroke-width="2">
    <line x1="40" y1="80" x2="40" y2="110" />
    <line x1="90" y1="80" x2="90" y2="110" />
    <line x1="140" y1="80" x2="140" y2="110" />
    <line x1="190" y1="80" x2="190" y2="110" />
    <line x1="240" y1="80" x2="240" y2="110" />
    <line x1="290" y1="80" x2="290" y2="110" />
    <line x1="340" y1="80" x2="340" y2="110" />
    <line x1="390" y1="80" x2="390" y2="110" />
    <line x1="440" y1="80" x2="440" y2="110" />
    <line x1="490" y1="80" x2="490" y2="110" />
    <line x1="540" y1="80" x2="540" y2="110" />
    <line x1="590" y1="80" x2="590" y2="110" />
    <line x1="640" y1="80" x2="640" y2="110" />
    <line x1="690" y1="80" x2="690" y2="110" />
    <line x1="740" y1="80" x2="740" y2="110" />
  </g>

  <!-- Parallel Metallic Conduits running downward into 3-phase DB panel -->
  <rect x="240" y="110" width="16" height="150" fill="url(#metalPipe)" />
  <rect x="270" y="110" width="16" height="150" fill="url(#metalPipe)" />
  <rect x="300" y="110" width="16" height="150" fill="url(#metalPipe)" />
  <rect x="330" y="110" width="16" height="150" fill="url(#metalPipe)" />
  <rect x="360" y="110" width="16" height="150" fill="url(#metalPipe)" />

  <!-- Heavy 3-Phase Industrial Distribution Board (DB) -->
  <rect x="200" y="240" width="380" height="230" rx="8" fill="#1E293B" stroke="#1F5FA8" stroke-width="4" />
  
  <!-- Internal Breaker Rows -->
  <g fill="#0F172A">
    <rect x="220" y="260" width="340" height="45" rx="4" />
    <rect x="220" y="320" width="340" height="45" rx="4" />
    <rect x="220" y="380" width="340" height="45" rx="4" />
  </g>

  <!-- 3-Phase Busbar Colors (Red, Yellow, Blue) -->
  <g transform="translate(230, 267)">
    <rect x="0" y="0" width="22" height="30" fill="#E31E24" rx="2" />
    <rect x="30" y="0" width="22" height="30" fill="#EAB308" rx="2" />
    <rect x="60" y="0" width="22" height="30" fill="#1F5FA8" rx="2" />
    <rect x="90" y="0" width="22" height="30" fill="#334155" rx="2" />

    <rect x="130" y="0" width="22" height="30" fill="#E31E24" rx="2" />
    <rect x="160" y="0" width="22" height="30" fill="#EAB308" rx="2" />
    <rect x="190" y="0" width="22" height="30" fill="#1F5FA8" rx="2" />
    <rect x="220" y="0" width="22" height="30" fill="#334155" rx="2" />
    
    <rect x="260" y="0" width="50" height="30" fill="#E31E24" rx="2" />
    <text x="285" y="20" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MAIN</text>
  </g>

  <!-- Warning High Voltage Badge -->
  <g transform="translate(480, 435)">
    <polygon points="12,0 24,20 0,20" fill="#EAB308" />
    <text x="12" y="17" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="32" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">415V 3-PHASE COMMERICAL</text>
  </g>

  <!-- Tag / Watermark -->
  <rect x="30" y="30" width="230" height="36" rx="6" fill="#1F5FA8" opacity="0.95" />
  <text x="145" y="53" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAMPLE PROJECT PHOTO</text>

  <text x="760" y="470" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" text-anchor="end">Commercial Conduit &amp; DB Panel</text>
</svg>
